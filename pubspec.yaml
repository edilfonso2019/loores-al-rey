name: loores_al_rey
description: Loores al Rey — Himnario Clásico (IASDMR) offline, con audio, partituras, listas de culto y respaldo.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  share_plus: ^13.3.1
  just_audio: ^0.10.6
  wakelock_plus: ^1.2.8
  http: ^1.6.0
  file_picker: ^13.3.3
  google_sign_in: ^7.2.0
  googleapis: ^18.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  path: ^1.9.1
  crypto: ^3.0.8
  pdfx: ^2.11.0
  permission_handler: ^13.0.2
  audio_service: ^0.18.19
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/clasico.json
    - assets/data/cg.json
    - assets/data/sincronizacion.json
    - assets/images/portada_violin.jpg
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Italic.ttf
          style: italic
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: GreatVibes
      fonts:
        - asset: assets/fonts/GreatVibes-Regular.ttf

# Ícono de la app: regenerar con `dart run flutter_launcher_icons`
# (las imágenes salen de tools/generar_icono.ps1).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icono.png
  adaptive_icon_background: "#0A245E"
  adaptive_icon_foreground: assets/icon/icono_frente.png
  min_sdk_android: 21
