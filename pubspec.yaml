name: loores_al_rey
description: Loores al Rey — Himnario Adventista (nuevo y antiguo), offline, con favoritos, audio y modo proyección.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  google_fonts: ^6.2.1
  just_audio: ^0.9.40
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
